# Local development database (credentials are dev-only)
services:
  db:
    image: postgres:17-alpine
    container_name: odin-book-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: mikul
      POSTGRES_PASSWORD: idkbro
      POSTGRES_DB: odin-book
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikul -d odin-book"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
